[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "income-prediction-classifier"
version = "1.2.0"
description = "From-scratch AdaBoost and modern ensemble benchmarks on the UCI Adult Census Income dataset."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Juan David Prada Malagon", email = "pradamalagonjd@gmail.com" },
]
keywords = [
  "machine-learning",
  "adaboost",
  "gradient-boosting",
  "census-income",
  "classification",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Intended Audience :: Science/Research",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.4",
  "matplotlib>=3.7",
  "seaborn>=0.13",
  "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ipykernel>=6.0", "jupyter>=1.0"]
demo = ["streamlit>=1.28"]

[project.scripts]
income-classifier = "income_classifier.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
